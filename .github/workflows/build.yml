name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MinGW 
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          arch: 'win64_mingw'
          modules: 'qtcharts'

      - name: Install dependencies
        run: |
          C:/vcpkg/vcpkg install rtaudio:x64-mingw-dynamic
          C:/vcpkg/vcpkg install libsamplerate:x64-mingw-dynamic
          C:/vcpkg/vcpkg install libsndfile:x64-mingw-dynamic
          C:/vcpkg/vcpkg integrate install

      - name: Configure CMake
        shell: msys2 {0}           
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic
          -G "Ninja"
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Deploy
        run: |
          cd build/src
          windeployqt trainer_1.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: trainer-windows
          path: build/src/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          modules: 'qtcharts' 

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librtaudio-dev libsamplerate0-dev libsndfile1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: trainer-linux
          path: build/src/trainer_1
